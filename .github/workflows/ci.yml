name: ERP CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install and Build Backend
      run: |
        cd backend
        npm ci
        npx prisma generate
        npm run lint
        npm test -- --runInBand
        npm run build

    - name: Install and Build Frontend
      run: |
        cd frontend
        npm ci
        npm run lint
        npm test
        npm run build

    - name: Validate Production Images
      run: |
        docker build --target runtime -t erp-grosir-backend-ci ./backend
        docker build --build-arg VITE_API_URL=/api/v1 --build-arg VITE_APP_ENV=production -t erp-grosir-frontend-ci ./frontend
