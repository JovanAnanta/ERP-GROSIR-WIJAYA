name: ERP CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install and Build Backend
      run: |
        cd backend
        npm ci
        npx prisma generate
        npm run build

    - name: Install and Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build