services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_grosir_wijaya
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diatur}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d erp_grosir_wijaya"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [erp_internal]

  migrate:
    build:
      context: ./backend
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL internal wajib diatur}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [erp_internal]
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: ${APP_ORIGIN:?APP_ORIGIN wajib berupa origin HTTPS aplikasi}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL internal wajib diatur}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks: [erp_internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
        VITE_APP_ENV: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [erp_internal]

networks:
  erp_internal:
    driver: bridge

volumes:
  postgres_data:
